<!DOCTYPE html>
<html>
<head>
<title>Student Performance Predictor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0F2A44;min-height:100vh;margin:0;padding:20px;display:flex;align-items:center;justify-content:center}
.card{background:#FFFFFF;width:100%;max-width:720px;padding:35px;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,0.25)}
.badge{text-align:center}
.badge span{background:#E8EEF5;color:#0F2A44;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:700}
h1{text-align:center;color:#1e293b;font-size:30px;margin:15px 0 5px}
p.sub{text-align:center;color:#64748b;margin:0 0 25px}
label{display:block;margin:16px 0 6px;font-weight:700;color:#334155;font-size:14px}
input{width:100%;padding:13px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;outline:none;transition:0.2s;background:#f8fafc}
input:focus{border-color:#d4d5e6;background:rgb(236, 231, 231);box-shadow:0 0 0 4px #e0e7ff}
.row{display:flex;gap:16px}
.row div{flex:1}
button{width:100%;background:#0F2A44;color:white;padding:16px;border:none;border-radius:12px;font-size:18px;font-weight:800;margin-top:25px;cursor:pointer;box-shadow:0 8px 20px rgba(99,102,241,0.4)}
button:hover{transform:translateY(-1px);box-shadow:0 12px 25px rgba(183, 184, 227, 0.5)}
.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:18px}
@media(max-width:600px){.row{flex-direction:column;gap:0}.card{padding:22px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="card">
<div class="badge"><span>✨ AI POWERED PREDICTION</span></div>
<h1>🎓 Student Performance Predictor</h1>
<p class="sub">Enter your details and get your predicted marks + smart tips</p>
<form action="/predict" method="POST">
<div class="row">
<div><label>📚 Study Hours (per day)</label><input type="number" step="any" name="study_hours" placeholder="e.g. 5" required></div>
<div><label>✅ Attendance (%)</label><input type="number" step="any" name="attendance" placeholder="e.g. 85" required></div>
</div>
<div class="row">
<div><label>📝 Previous Marks (%)</label><input type="number" step="any" name="previous_marks" placeholder="e.g. 70" required></div>
<div><label>📂 Assignment (%)</label><input type="number" step="any" name="assignment" placeholder="e.g. 90" required></div>
</div>
<div class="row">
<div><label>😴 Sleep Hours</label><input type="number" step="any" name="sleep_hours" placeholder="e.g. 7" required></div>
<div><label>📱 Social Media (hrs)</label><input type="number" step="any" name="social_hours" placeholder="e.g. 2" required></div>
</div>
<button type="submit">Predict Performance →</button>
</form>
</div>
</body>
</html>
